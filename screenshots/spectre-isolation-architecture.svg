<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="45" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">Cross-Origin Isolation &amp; Spectre Side-Channel Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Comparing Process Sharing Vulnerabilities vs. COOPShield Pro Hardware Boundary Isolation</text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="100" width="440" height="500" rx="12" fill="#151b2b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="100" width="440" height="40" rx="12" fill="rgba(239, 68, 68, 0.15)"/>
  <text x="260" y="126" fill="#f87171" font-weight="bold" font-size="14" text-anchor="middle">UNISOLATED BROWSING CONTEXT (VULNERABLE)</text>

  <!-- Shared OS Process Box -->
  <rect x="60" y="160" width="400" height="260" rx="8" fill="#0d111c" stroke="#232d45"/>
  <text x="260" y="185" fill="#94a3b8" font-weight="bold" font-size="12" text-anchor="middle">Single Operating System Renderer Process</text>

  <!-- Victim Context -->
  <rect x="80" y="205" width="160" height="110" rx="6" fill="#1b2438" stroke="#3b82f6"/>
  <text x="160" y="230" fill="#60a5fa" font-weight="bold" font-size="12" text-anchor="middle">Victim Web App</text>
  <text x="160" y="250" fill="#94a3b8" font-size="10" text-anchor="middle">bank.portal.com</text>
  <rect x="95" y="270" width="130" height="28" rx="4" fill="#0a0d14"/>
  <text x="160" y="288" fill="#f59e0b" font-size="10" font-family="monospace" text-anchor="middle">Secret Auth Token</text>

  <!-- Attacker Context -->
  <rect x="280" y="205" width="160" height="110" rx="6" fill="#2d151d" stroke="#ef4444"/>
  <text x="360" y="230" fill="#f87171" font-weight="bold" font-size="12" text-anchor="middle">Attacker Iframe</text>
  <text x="360" y="250" fill="#94a3b8" font-size="10" text-anchor="middle">evil-tracker.io</text>
  <rect x="295" y="270" width="130" height="28" rx="4" fill="#0a0d14"/>
  <text x="360" y="288" fill="#ef4444" font-size="10" font-family="monospace" text-anchor="middle">Cache Timer Loop</text>

  <!-- Speculative Execution arrow -->
  <path d="M 295 285 L 225 285" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="260" y="340" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">Branch Target Injection (BTB)</text>
  <text x="260" y="360" fill="#94a3b8" font-size="10" text-anchor="middle">L1/L3 Cache Hit Timing Reveals Secret Bytes</text>

  <rect x="60" y="440" width="400" height="140" rx="8" fill="#2d151d" stroke="#ef4444"/>
  <text x="80" y="465" fill="#f87171" font-weight="bold" font-size="12">Security Impact:</text>
  <text x="80" y="490" fill="#fca5a5" font-size="11">&bull; Private encryption keys and session tokens leaked</text>
  <text x="80" y="510" fill="#fca5a5" font-size="11">&bull; Browser disables SharedArrayBuffer to protect user</text>
  <text x="80" y="530" fill="#fca5a5" font-size="11">&bull; High-performance WebAssembly multithreading blocked</text>
  <text x="80" y="550" fill="#fca5a5" font-size="11">&bull; Reverse tabnabbing vulnerability via window.opener</text>

  <!-- Right: Fortified Architecture -->
  <rect x="520" y="100" width="440" height="500" rx="12" fill="#151b2b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="520" y="100" width="440" height="40" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="740" y="126" fill="#34d399" font-weight="bold" font-size="14" text-anchor="middle">COOPSHIELD PRO ZERO-TRUST ISOLATION</text>

  <!-- Process 1 -->
  <rect x="540" y="160" width="190" height="260" rx="8" fill="#0d111c" stroke="#10b981"/>
  <text x="635" y="185" fill="#34d399" font-weight="bold" font-size="11" text-anchor="middle">Dedicated OS Process A</text>
  <rect x="555" y="205" width="160" height="110" rx="6" fill="#132621" stroke="#10b981"/>
  <text x="635" y="230" fill="#34d399" font-weight="bold" font-size="12" text-anchor="middle">Isolated Host App</text>
  <text x="635" y="250" fill="#94a3b8" font-size="10" text-anchor="middle">COOP: same-origin</text>
  <rect x="565" y="270" width="140" height="28" rx="4" fill="#0a0d14"/>
  <text x="635" y="288" fill="#10b981" font-size="10" font-family="monospace" text-anchor="middle">SharedArrayBuffer [✓]</text>

  <!-- Process 2 -->
  <rect x="750" y="160" width="190" height="260" rx="8" fill="#0d111c" stroke="#232d45"/>
  <text x="845" y="185" fill="#94a3b8" font-weight="bold" font-size="11" text-anchor="middle">Isolated OS Process B</text>
  <rect x="765" y="205" width="160" height="110" rx="6" fill="#1b2438" stroke="#3b82f6"/>
  <text x="845" y="230" fill="#60a5fa" font-weight="bold" font-size="12" text-anchor="middle">Subresource / Iframe</text>
  <text x="845" y="250" fill="#94a3b8" font-size="10" text-anchor="middle">COEP: credentialless</text>
  <rect x="775" y="270" width="140" height="28" rx="4" fill="#0a0d14"/>
  <text x="845" y="288" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">Credentialless Sandboxed</text>

  <!-- Hardware Barrier line -->
  <line x1="740" y1="160" x2="740" y2="420" stroke="#10b981" stroke-width="2" stroke-dasharray="6,6"/>

  <rect x="540" y="440" width="400" height="140" rx="8" fill="#132621" stroke="#10b981"/>
  <text x="560" y="465" fill="#34d399" font-weight="bold" font-size="12">Hardened Security Guarantees:</text>
  <text x="560" y="490" fill="#a7f3d0" font-size="11">&bull; Spectre cache timing attack physically blocked by OS kernel</text>
  <text x="560" y="510" fill="#a7f3d0" font-size="11">&bull; crossOriginIsolated === true (full Wasm multithreading)</text>
  <text x="560" y="530" fill="#a7f3d0" font-size="11">&bull; Credentialless mode allows Google Fonts/CDNs to load seamlessly</text>
  <text x="560" y="550" fill="#a7f3d0" font-size="11">&bull; Zero reverse tabnabbing via severed window.opener</text>
</svg>
