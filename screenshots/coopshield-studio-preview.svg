<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131929"/>
      <stop offset="100%" stop-color="#171f32"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="72" rx="12" fill="#101522" stroke="#232d45"/>
  <rect x="50" y="38" width="44" height="44" rx="8" fill="url(#accentGrad)" filter="url(#glow)"/>
  <text x="72" y="66" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">CS</text>
  <text x="110" y="56" fill="#fff" font-weight="bold" font-size="18">COOPShield Pro <tspan fill="#06b6d4" font-size="12">v1.0.0</tspan></text>
  <text x="110" y="74" fill="#94a3b8" font-size="12">Enterprise Cross-Origin Isolation (COOP / COEP / CORP) Studio &amp; Spectre Defense Simulator</text>

  <!-- Status Pill -->
  <rect x="940" y="42" width="210" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981"/>
  <circle cx="960" cy="60" r="5" fill="#10b981"/>
  <text x="975" y="64" fill="#34d399" font-weight="bold" font-size="12" font-family="monospace">crossOriginIsolated: true</text>

  <!-- Left Column: Policy Builder -->
  <rect x="30" y="116" width="555" height="380" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="50" y="146" fill="#fff" font-weight="bold" font-size="15">Policy Configuration Matrix</text>
  <rect x="470" y="132" width="95" height="20" rx="10" fill="#232d45"/>
  <text x="517" y="146" fill="#06b6d4" font-size="10" font-weight="bold" text-anchor="middle">W3C STANDARDS</text>

  <!-- COOP Row -->
  <text x="50" y="180" fill="#f1f5f9" font-weight="bold" font-size="13" font-family="monospace">Cross-Origin-Opener-Policy (COOP)</text>
  <rect x="50" y="192" width="515" height="36" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <rect x="52" y="194" width="168" height="32" rx="4" fill="#10b981"/>
  <text x="136" y="215" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle" font-family="monospace">same-origin</text>
  <text x="308" y="215" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">allow-popups</text>
  <text x="478" y="215" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">unsafe-none</text>

  <!-- COEP Row -->
  <text x="50" y="255" fill="#f1f5f9" font-weight="bold" font-size="13" font-family="monospace">Cross-Origin-Embedder-Policy (COEP)</text>
  <rect x="50" y="267" width="515" height="36" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <text x="136" y="290" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">require-corp</text>
  <rect x="224" y="269" width="168" height="32" rx="4" fill="#10b981"/>
  <text x="308" y="290" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle" font-family="monospace">credentialless</text>
  <text x="478" y="290" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">unsafe-none</text>

  <!-- CORP Row -->
  <text x="50" y="330" fill="#f1f5f9" font-weight="bold" font-size="13" font-family="monospace">Cross-Origin-Resource-Policy (CORP)</text>
  <rect x="50" y="342" width="515" height="36" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <rect x="52" y="344" width="125" height="32" rx="4" fill="#3b82f6"/>
  <text x="114" y="365" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle" font-family="monospace">same-origin</text>
  <text x="242" y="365" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">same-site</text>
  <text x="370" y="365" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">cross-origin</text>
  <text x="498" y="365" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">none</text>

  <!-- Telemetry Row -->
  <rect x="50" y="400" width="515" height="74" rx="6" fill="#101522" stroke="#232d45"/>
  <text x="65" y="422" fill="#38bdf8" font-weight="bold" font-size="11">REPORTING API TELEMETRY</text>
  <text x="65" y="442" fill="#fff" font-size="11" font-family="monospace">Reporting-Endpoints: coop-endpoint="https://reports.saasplatform.com/coop"</text>
  <text x="65" y="460" fill="#10b981" font-size="11">✓ Real-time violation beacons active &bull; Canary rollout supported</text>

  <!-- Right Column: 10-Point Auditor -->
  <rect x="615" y="116" width="555" height="380" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="635" y="146" fill="#fff" font-weight="bold" font-size="15">10-Point Spectre &amp; Breakage Auditor</text>
  <rect x="1055" y="132" width="95" height="20" rx="10" fill="#232d45"/>
  <text x="1102" y="146" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">SCORE: 100/100</text>

  <!-- Score Banner -->
  <rect x="635" y="165" width="515" height="68" rx="8" fill="#101522" stroke="#232d45"/>
  <circle cx="675" cy="199" r="26" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="206" fill="#10b981" font-weight="bold" font-size="18" text-anchor="middle">A+</text>
  <text x="715" y="190" fill="#fff" font-weight="bold" font-size="14">Fortified Zero-Trust Posture</text>
  <text x="715" y="208" fill="#94a3b8" font-size="11">Full cross-origin isolation enabled with credentialless subresource safety.</text>

  <!-- Audit Items -->
  <g transform="translate(635, 245)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Spectre Side-Channel Defense</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (20/20)</text>
  </g>

  <g transform="translate(635, 290)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Reverse Tabnabbing &amp; Opener Protection</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (10/10)</text>
  </g>

  <g transform="translate(635, 335)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">CDN Subresource &amp; Media Breakage Defense</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (15/15)</text>
  </g>

  <g transform="translate(635, 380)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">WebAssembly SharedArrayBuffer Readiness</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (5/5)</text>
  </g>

  <g transform="translate(635, 425)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Reporting API Violation Telemetry</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (10/10)</text>
  </g>

  <!-- Bottom Panel: Server Synthesizer & Simulator -->
  <rect x="30" y="520" width="1140" height="240" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="50" y="550" fill="#fff" font-weight="bold" font-size="15">Synthesized Multi-Server Directives (Nginx)</text>
  <rect x="45" y="565" width="1110" height="175" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <text x="65" y="595" fill="#64748b" font-family="monospace" font-size="12"># COOPShield Pro - Nginx Cross-Origin Isolation Configuration</text>
  <text x="65" y="618" fill="#38bdf8" font-family="monospace" font-size="12">add_header Cross-Origin-Opener-Policy "same-origin; report-to="coop-endpoint"" always;</text>
  <text x="65" y="641" fill="#38bdf8" font-family="monospace" font-size="12">add_header Cross-Origin-Embedder-Policy "credentialless; report-to="coep-endpoint"" always;</text>
  <text x="65" y="664" fill="#38bdf8" font-family="monospace" font-size="12">add_header Cross-Origin-Resource-Policy "same-origin" always;</text>
  <text x="65" y="687" fill="#38bdf8" font-family="monospace" font-size="12">add_header Reporting-Endpoints 'coop-endpoint="https://reports.saasplatform.com/coop", coep-endpoint="https://reports.saasplatform.com/coop"' always;</text>
  <text x="65" y="718" fill="#10b981" font-family="monospace" font-size="12"># Result: window.crossOriginIsolated === true &bull; SharedArrayBuffer Enabled &bull; Zero Spectre Risk</text>
</svg>
